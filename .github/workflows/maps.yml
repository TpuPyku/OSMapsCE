# The regions' offline data for OSMapsCE (the road graph, the search): built from openstreetmap.fr's extracts by
# offline/release_regions.py, put into the release "maps" (a pre-release - never the program's latest; its assets
# replaced on each run). The PC app (offline/maps_app.py) reads its catalog.json; the tiles are not here: the app cuts
# them out of Protomaps' build.
name: maps

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Что собрать: all - всё; trunk - граф магистралей России и СНГ; app - программу для ПК'
        default: all
        type: choice
        options: [all, trunk, app]
  schedule:
    - cron: '0 3 * * 1'   # Mondays, 03:00 UTC

permissions:
  contents: write

jobs:
  list:
    if: ${{ inputs.only == '' || inputs.only == 'all' }}
    runs-on: ubuntu-latest
    outputs:
      regions: ${{ steps.list.outputs.regions }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install osmium pmtiles   # (release_regions imports the builders)
      - id: list
        run: echo "regions=$(python offline/release_regions.py list)" >> "$GITHUB_OUTPUT"

  build:
    needs: list
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # a region failing leaves the others (and its previous data in the catalog)
      max-parallel: 16   # (a region whole - its tiles cut, onto Yandex Disk - takes 40 min on average, 3 h the
                         # biggest: 8 at a time took ~10 h, 2026-10-30; public repos: up to 20 jobs)
      matrix:
        region: ${{ fromJSON(needs.list.outputs.regions) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install osmium pmtiles
      # with the secret (the user 2026-10-30: GitHub's downloads slow): the region whole - its tiles cut out of
      # Protomaps' build too - onto the owner's Yandex Disk (offline/yadisk.py), only its entry into the artifact
      - run: python offline/release_regions.py build ${{ matrix.region }} dist
        env:
          YANDEX_DISK_TOKEN: ${{ secrets.YANDEX_DISK_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.region }}
          path: dist/
          retention-days: 3

  publish:
    needs: [build, trunk]   # (trunk: its date into the catalog first - this run's catalog keeps it)
    if: ${{ !cancelled() && (inputs.only == '' || inputs.only == 'all') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      YANDEX_DISK_TOKEN: ${{ secrets.YANDEX_DISK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: pip install osmium pmtiles
      - name: The release (once)
        run: |
          gh release view maps >/dev/null 2>&1 || gh release create maps --prerelease --title "Карты OSMapsCE" \
            --notes "Граф дорог и поиск областей для OSMapsCE без интернета. Записывает на флешку приложение «Карты OSMapsCE»; плитки оно вырезает из сборки Protomaps. Данные © участники OpenStreetMap, ODbL."
      - name: The catalog (the regions not rebuilt this time kept from the previous one)
        run: |
          gh release download maps -p catalog.json -O previous.json || echo '{"regions": []}' > previous.json
          python offline/release_regions.py catalog dist previous.json
      - name: The overview whole onto Yandex Disk, its folder public (the catalog tells the link)
        if: ${{ env.YANDEX_DISK_TOKEN != '' }}
        run: python offline/release_regions.py disk dist
      - name: The regions' outlines for the app's map (the sources' .poly)
        run: python offline/make_outlines.py dist/outlines.json
      - run: gh release upload maps dist/*.zip dist/catalog.json dist/outlines.json --clobber
      - name: The zips no longer in the catalog (regions merged or gone) removed
        run: |
          keep=" catalog.json outlines.json trunk.zip $(python -c "import json; print(' '.join(r['zip'] for r in json.load(open('dist/catalog.json'))['regions']))") "
          for a in $(gh release view maps --json assets --jq '.assets[].name'); do
            case "$keep" in *" $a "*) ;; *) gh release delete-asset maps "$a" -y ;; esac
          done

  app:   # the PC app that writes the maps to a flash drive, for users without Python (offline/build_app.bat) - in a
         # release of its own, maps-app (the user 2026-10-28: lost among the maps' zips), never the program's latest
    needs: publish
    if: ${{ !cancelled() && inputs.only != 'trunk' }}
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller pmtiles osmium pillow
      - run: offline\build_app.bat
        shell: cmd
      - name: The app's release (once)
        shell: bash
        run: |
          gh release view maps-app >/dev/null 2>&1 || gh release create maps-app --latest=false --title "Карты OSMapsCE — программа для ПК"             --notes "Записывает карты областей для OSMapsCE на флешку или SD-карту: распакуйте архив, запустите OSMapsCE-Maps.exe, отметьте области щелчком, нажмите «Записать выбранные». Карты — в релизе maps. Данные © участники OpenStreetMap, ODbL."
      - run: gh release upload maps-app offline/app/OSMapsCE-Maps.zip --clobber
        shell: bash

  trunk:   # 4b (the user 2026-10-29): the trunk roads of Russia and the CIS - motorway / trunk / primary with their
           # links (offline/make_graph.py TRUNK) - for routes from one region to another without the internet.
           # Geofabrik's countries, each cut to the trunk roads at once (the disk: Russia alone is 4 GB), merged.
    if: ${{ inputs.only == '' || inputs.only == 'all' || inputs.only == 'trunk' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get install -y osmium-tool && pip install osmium pmtiles
      - name: The countries' trunk roads
        run: |
          df -h / | tail -1
          mkdir -p cut dist
          for c in russia europe/belarus europe/ukraine europe/moldova europe/georgia asia/kazakhstan asia/uzbekistan \
                   asia/kyrgyzstan asia/tajikistan asia/turkmenistan asia/azerbaijan asia/armenia; do
            n=$(basename $c)
            curl -sSfL -o src.pbf "https://download.geofabrik.de/$c-latest.osm.pbf"
            osmium tags-filter src.pbf w/highway=motorway,trunk,primary,motorway_link,trunk_link,primary_link \
              -o cut/$n.pbf --overwrite
            echo "$n: $(du -m src.pbf | cut -f1) MB -> $(du -m cut/$n.pbf | cut -f1) MB"
            rm src.pbf
          done
          osmium merge cut/*.pbf -o trunk.pbf --overwrite
          du -m trunk.pbf
      - name: The graph
        run: |
          /usr/bin/time -v python offline/make_graph.py trunk.pbf dist/trunk.grf trunk 2>&1 | \
            grep -E "nodes|Maximum resident|Elapsed"
          printf 'name=trunk\ndate=%s\n' "$(date -u +%Y-%m-%d)" > dist/region.txt
          (cd dist && zip -9 trunk.zip trunk.grf region.txt)
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: trunk
          path: dist/trunk.zip
          retention-days: 7
      - name: Into the release maps (and how big it is now)
        run: |
          gh release upload maps dist/trunk.zip --clobber
          gh release view maps --json assets --jq '[.assets[].size] | add / 1e6 | "release maps: \(.) MB"'
      - name: Its build into the catalog (the app and OSMapsCE tell an older one on the card - 2026-10-30)
        run: |
          mkdir -p cat
          if gh release download maps -p catalog.json -D cat; then
            python offline/release_regions.py trunk cat/catalog.json dist/trunk.zip
            gh release upload maps cat/catalog.json --clobber
          fi
